<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrthoGather</title>
  <link rel="icon" href="static/images/1-a668dcaa1.ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }
  
    :root{
      --font-sans: "Helvetica Neue", Helvetica, Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }
  
    html, body { height: 100%; }
    html, body, button, input, select, textarea {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

  
    body {
      background-color: #fffcfc;
      display: flex;
      flex-direction: column;
    }
  

    header {
      display: grid;                         
      grid-template-columns: 1fr auto 1fr;    
      align-items: center;
      gap: 24px;
      padding: 20px 40px;
      background-color: #003366;
      color: #fff;
    }
  
    header .logo { justify-self: start; }
    header img { height: 150px; }
  
    header .title {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif !important;
      font-weight: 400 !important;
      font-size: 80px;
      margin: 0;
      letter-spacing: 0.2px;
    }


  
    header .info {
      justify-self: end;
      text-align: right;
      line-height: 1.25;
      font-size: 14px;
      color: inherit;                        
      max-width: 36ch;                        
    }
    header .info p { margin: 2px 0; }
    header .info a { color: inherit; text-decoration: none; }
    header .info a:hover, header .info a:focus {
      color: #ffd700; text-decoration: underline;
    }
    header .info a.email-link { overflow-wrap: anywhere; }
    header .info .muted { opacity: 0.85; }
  

    .main-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 120px;
      padding: 100px 40px;
      flex: 1;
    }
  
    .menu { position: relative; text-align: center; }
  
    .menu img {
      width: 240px;
      height: 240px;
      object-fit: contain;
      border-radius: 16px;
      transition: transform 0.3s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      cursor: pointer;
    }
    .menu:hover img { transform: scale(1.05); }
  
    .menu:hover .submenu, .submenu:hover { display: flex; }
  
    .submenu {
      display: none;
      flex-direction: row;
      gap: 60px;
      padding: 30px 0 0;
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }
  
    .submenu img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s;
      cursor: pointer;
    }
    .submenu img:hover { transform: scale(1.08); }
  
    .connector { position: absolute; top: 90%; left: 50%; transform: translateX(-50%); width: 0; height: 0; pointer-events: none; }
    .connector svg { overflow: visible; }
    .connector path { stroke: #003366; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  

    footer {
      background-color: #003366;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer .social-icons a { color: white; margin-left: 15px; font-size: 20px; text-decoration: none; }
    footer .social-icons a:hover { color: #ffd700; }

    #loading-overlay {
      display: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: rgba(255,255,255,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    #loading-overlay .spinner {
      width: 80px; height: 80px;
      border: 8px solid #ccc; border-top: 8px solid #003366;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% {transform: rotate(0deg);} 100% {transform: rotate(360deg);} }
  </style>
  
</head>
<body>
  <header>
    <div class="logo">
      <img src="static/images/1-a668dcaa1.ico" alt="Tool Logo" />
    </div>
    <div class="title">OrthoGather</div>
    <div class="info">
      <p>University College Dublin</p>
      <p>
        <a href="https://cancerdata.ucd.ie/" target="_blank" rel="noopener" class="info-link">
          UCD Cancer Data Lab
        </a>
      </p>
      <p>
        <span class="muted"></span>
        <a href="mailto:carlos.vivasrodriguez@ucdconnect.ie" class="info-link email-link">
          carlos.vivasrodriguez@ucdconnect.ie
        </a>
      </p>
    </div>    
  </header>

  <div class="main-container">
    <div class="menu">
      <img src="static/images/folder.png" alt="Upload ZIP" />
      <div class="submenu">
        <img src="static/images/boton1.png" alt="Protein Analysis"
             onclick="document.getElementById('zipInput').click();" />
        <img src="static/images/boton2.png" alt="Gene Ontology Analysis"
          onclick="document.getElementById('zipInputGO').click();" />
      </div>
      <div class="connector">
        <svg width="0" height="0">
          <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
              <polygon points="0 0, 10 3.5, 0 7" fill="#003366" />
            </marker>
          </defs>
          <path d="M0 0 C 0 20, -60 40, -90 60" />
          <path d="M0 0 C 0 20, 60 40, 90 60" />
        </svg>
      </div>
    </div>
  
    <form id="uploadForm" action="/cargar_carpeta?modo=upload" method="POST" enctype="multipart/form-data" style="display:none;">
      <input type="file" id="zipInput" name="file" accept=".zip"
             onchange="document.getElementById('uploadForm').submit();" />
    </form>

    <input type="file" id="zipInputGO" name="file" accept=".zip,application/zip,application/x-zip-compressed" style="display:none;"
      onchange="handleGOZipChange(event)" />
  
    <div class="menu">
      <img src="static/images/NewAnalysis.png" alt="New Analysis" onclick="location.href='/1-seleccion_especies'"/>
    </div>
  
    <div class="menu">
      <img src="static/images/Preselected.png" alt="Use Preselected" />
      <div class="submenu">
        <img src="static/images/boton1.png" alt="Protein Analysis" onclick="location.href='/cargar_carpeta?filename=Orthogroups.zip&modo=preselected'" />
        <img src="static/images/boton2.png" alt="Gene Ontology Analysis" onclick="runGeneOntologyPreselected()" />
      </div>
      <div class="connector">
        <svg width="0" height="0">
          <path d="M0 0 C 0 20, -60 40, -90 60" />
          <path d="M0 0 C 0 20, 60 40, 90 60" />
        </svg>
      </div>
    </div>
  </div>
  
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>
  
  <script>
    function showSpinner() {
      document.getElementById('loading-overlay').style.display = 'flex';
    }
    function hideSpinner() {
      document.getElementById('loading-overlay').style.display = 'none';
    }
  
    async function handleGOZipChange(ev) {
      const file = ev.target.files && ev.target.files[0];
      if (!file) { return; }
      try {
        showSpinner();
        const fd = new FormData();
        fd.append('file', file);
        const res = await fetch('/cargar_carpeta?modo=upload', {
          method: 'POST',
          body: fd
        });
        if (!res.ok) {
          hideSpinner();
          alert('Error uploading Orthogroups.zip for GO (upload).');
          return;
        }
        window.location.href = '/resultado_goa';
      } catch (e) {
        hideSpinner();
        alert('Error: ' + e.message);
      }
    }
  
    async function runGeneOntologyPreselected() {
      try {
        showSpinner();
        const prepResponse = await fetch('/cargar_carpeta?filename=Orthogroups.zip&modo=preselected');
  
        if (!prepResponse.ok) {
          hideSpinner();
          alert('Error preparing data for GO analysis.');
          return;
        }
  
        window.location.href = '/resultado_goa';
      } catch (e) {
        hideSpinner();
        alert('Unexpected error: ' + e.message);
      }
    }
  
    const dropdowns = document.querySelectorAll('.menu');
    dropdowns.forEach(menu => {
      const submenu = menu.querySelector('.submenu');
      if (!submenu) return;
      let timeout;
  
      menu.addEventListener('mouseenter', () => {
        clearTimeout(timeout);
        submenu.style.display = 'flex';
      });
      menu.addEventListener('mouseleave', () => {
        timeout = setTimeout(() => {
          submenu.style.display = 'none';
        }, 200);
      });
      submenu.addEventListener('mouseenter', () => {
        clearTimeout(timeout);
        submenu.style.display = 'flex';
      });
      submenu.addEventListener('mouseleave', () => {
        timeout = setTimeout(() => {
          submenu.style.display = 'none';
        }, 200);
      });
    });
  
    window.onload = function () {
      const overlay = document.getElementById('loading-overlay');
      if (overlay) overlay.style.display = 'none';
    };
  </script>
  
  

  <footer>
    <div>
      &copy; 2025 OrthoGather. All rights reserved.
    </div>
    <div class="social-icons">
      <a href="https://github.com" target="_blank"><i class="fab fa-github"></i></a>
      <a href="#">FAQ</a>
      <a href="#">Contact</a>
    </div>
  </footer>

</body>
</html>
