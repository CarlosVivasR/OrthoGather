<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OrthoGather</title>
  <link rel="icon" href="static/images/1-a668dcaa1.ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root{
      --font-sans: "Helvetica Neue", Helvetica, Arial, "Noto Sans", "Liberation Sans", sans-serif;
    }
    html, body { height: 100%; }
    html, body, button, input, select, textarea {
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background-color: #fffcfc;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #003366;
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header .title {
      font-family: var(--font-sans);
      font-weight: 400;
      font-size: 80px;
      margin: 0;
      letter-spacing: 0.2px;
    }

    header .logo img { height: 150px; }

    header .info {
      justify-self: end;
      text-align: right;
      line-height: 1.25;
      font-size: 14px;
      color: inherit;                         
      max-width: 36ch;                        
    }
    header .info p { margin: 2px 0; }
    header .info a { color: inherit; text-decoration: none; }
    header .info a:hover, header .info a:focus {
      color: #ffd700; text-decoration: underline;
    }
    header .info a.email-link { overflow-wrap: anywhere; }
    header .info .muted { opacity: 0.85; }

    main {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: stretch;     
    }

    .card {
      max-width: 1000px;
      width: min(1000px, 92vw); 
      margin: 0 auto;           
      background-color: white;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h2, h3 {
      margin-bottom: 10px;
      color: #003366;
      text-align: center;
    }

    hr {
      border: none;
      border-top: 1px solid #ccc;
      margin: 20px 0;
    }

    #search {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #results {
      background-color: white;
      border: 1px solid #ccc;
      border-radius: 5px;
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 20px;
    }

    .option {
      padding: 10px;
      cursor: pointer;
      border-bottom: 1px solid #eee;
    }

    .option:hover {
      background-color: #f5f5f5;
    }

    .selected-item {
      border-bottom: 1px solid #ccc;
      padding: 8px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-left: 10px;
    }

    .reference { background: #d7e9f3; color: #084081; }
    .non-reference { background: #fdeacc; color: #7a3e00; }

    .button-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 30px;
      margin: 20px auto;       
    }

    .button-group button {
      min-width: 220px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button:hover:enabled {
      background-color: #002244;
    }

    .status-message {
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 10px;
    }

    .status-message.success {
      background-color: #d1e7dd;
      color: #0f5132;
    }

    .status-message.error {
      background-color: #f8d7da;
      color: #842029;
    }

    .log-panel {
      background-color: #1e1e1e;
      color: #dcdcdc;
      padding: 20px;
      border-radius: 6px;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
      display: none;
      max-width: 1000px;
      width: min(1000px, 92vw);
      margin: 20px auto 0;   
    }


    #loadingGif {
      text-align: center;
      margin-top: 10px;
      display: none;
    }

    #postAnalysisButtons {
      display: none;
      text-align: center;
      margin: 40px 0;
    }

    #postAnalysisButtons img {
      width: 160px;
      margin: 0 20px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #postAnalysisButtons img:hover {
      transform: scale(1.05);
    }

    footer {
      background-color: #003366;
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    footer .social-icons a {
      color: white;
      margin-left: 15px;
      font-size: 20px;
      text-decoration: none;
    }

    footer .social-icons a:hover {
      color: #ffd700;
    }
    .remove-btn {
      all: unset;                  
      display: inline-flex;        
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #888;
      font-size: 16px;
      padding: 4px;              
      border-radius: 4px;          
      transition: color 0.2s, transform 0.2s, background-color 0.2s;
    }

    .remove-btn:hover {
      color: #e73d09;
      transform: scale(1.15);
      background-color: #f0f0f0;   
    }


    .remove-btn:focus,
    .remove-btn:focus-visible {
      outline: none;
      background-color: #e0e0e0;   
    }

    #downloadStatus {
      margin-top: 6px;               
      text-align: center;
      font-weight: 600;
      text-decoration: none;          
      background: transparent !important;
      border: 0 !important;
      padding: 0 !important;
      border-radius: 0 !important;
    }


    #downloadStatus.success { color: #0f5132; } 
    #downloadStatus.error   { color: #842029; }  

  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="static/images/1-a668dcaa1.ico" alt="Tool Logo" />
    </div>
    <div class="title">OrthoGather</div>
    <div class="info">
      <p>University College Dublin</p>
      <p>
        <a href="https://cancerdata.ucd.ie/" target="_blank" rel="noopener" class="info-link">
          UCD Cancer Data Lab
        </a>
      </p>
      <p>
        <span class="muted"></span>
        <a href="mailto:carlos.vivasrodriguez@ucdconnect.ie" class="info-link email-link">
          carlos.vivasrodriguez@ucdconnect.ie
        </a>
      </p>
    </div>    
  </header>

  <main>
    <div class="card">
      <h2>Select species from UniProt catalog</h2>
      <hr>
      <input type="text" id="search" placeholder="Type organism name or proteome ID...">
      <div id="results"></div>

      <h3>Selected species</h3>
      <hr>
      <div id="selected"></div>
    </div> 
    <div class="button-group">
      <button id="downloadBtn">📥 Download Proteomes</button>
      <button id="runOrthofinderBtn" disabled>⚙️ Run OrthoFinder</button>
    </div>

    <div id="downloadStatus" class="status-message hidden"></div>

    <div id="loadingGif">
      <img src="static/images/loading.gif" alt="Loading..." style="width: 60px; height: 60px;">
      <p style="color: #003366; font-weight: bold;"> Running OrthoFinder...</p>
    </div>

    <div id="logPanel" class="log-panel"></div>

    <div id="postAnalysisButtons">
      <h3 style="color: #003366; margin-bottom: 20px;">Choose further analysis:</h3>
      <img src="static/images/boton1.png" alt="Protein Analysis"
          onclick="goProteinAnalysisGenerated()" />
      <img src="static/images/boton2.png" alt="Gene Ontology Analysis"
          onclick="goGeneOntologyGenerated()" />
    </div>

  </main>

  <footer>
    <div>
      &copy; 2025 OrthoGather. All rights reserved.
    </div>
    <div class="social-icons">
      <a href="https://github.com" target="_blank"><i class="fab fa-github"></i></a>
      <a href="#">FAQ</a>
      <a href="#">Contact</a>
    </div>
  </footer>

  <script>
    let proteomeData = [];
    let selectedTemp = [];
  
    const resultsDiv = document.getElementById("results");
    const selectedDiv = document.getElementById("selected");
  

    function postAndRedirect(url, params) {
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = url;
      for (const key in params) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = params[key];
        form.appendChild(input);
      }
      document.body.appendChild(form);
      form.submit();
    }

    function goProteinAnalysisGenerated() {
      postAndRedirect('/cargar_carpeta', { modo: 'generated' });
    }
  
    async function goGeneOntologyGenerated() {
      try {
        await fetch('/cargar_carpeta', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ modo: 'generated' })
        });
        window.location.href = '/resultado_goa';
      } catch (e) {
        alert('Error preparing data for GO (generated): ' + e.message);
      }
    }
  
    window.goProteinAnalysisGenerated = goProteinAnalysisGenerated;
    window.goGeneOntologyGenerated = goGeneOntologyGenerated;
  
    fetch("static/Proteomes_json/proteomes_list.json")
      .then(res => res.json())
      .then(data => { proteomeData = data; })
      .catch(err => {
        const status = document.getElementById("downloadStatus");
        status.textContent = "❌ Error loading proteomes_list.json: " + err;
        status.classList.remove("hidden");
        status.classList.add("error");
      });
  
    document.getElementById("search").addEventListener("input", function () {
      const searchTerm = this.value.toLowerCase();
      resultsDiv.innerHTML = "";
      if (searchTerm.length < 2) return;
  
      const matches = proteomeData.filter(item =>
        item.label.toLowerCase().includes(searchTerm) ||
        item["Proteome Id"].toLowerCase().includes(searchTerm)
      ).slice(0, 20);
  
      if (matches.length === 0) {
        resultsDiv.innerHTML = "<div class='status-message error'>⚠️ No matches found.</div>";
        return;
      }
  
      matches.forEach(item => {
        const div = document.createElement("div");
        div.className = `option ${item.type}`;
        div.textContent = item.label;
        div.setAttribute("data-id", item["Proteome Id"]);
        div.setAttribute("data-label", item.label);
  
        resultsDiv.appendChild(div);
  
        div.addEventListener("click", function () {
          const id = this.getAttribute("data-id");
          if (!selectedTemp.find(x => x.id === id)) {
            selectedTemp.push({
              id,
              label: this.getAttribute("data-label"),
              type: this.classList.contains("reference") ? "reference" : "non-reference"
            });
            updateSelected();
          }
          document.getElementById("search").value = "";
          resultsDiv.innerHTML = "";
        });
      });
    });
  
    function updateSelected() {
      selectedDiv.innerHTML = selectedTemp.map((item, index) => `
        <div class="selected-item">
          <div>${item.label} <span class="badge ${item.type}">${item.type}</span></div>
          <button class="remove-btn" onclick="removeSelected(${index})">
            <i class="fas fa-trash"></i>
          </button>
        </div>
      `).join("");
    }
  
    function removeSelected(index) {
      selectedTemp.splice(index, 1);
      updateSelected();
    }

    document.getElementById("downloadBtn").addEventListener("click", function () {
      const ids = selectedTemp.map(item => item.id);
      const status = document.getElementById("downloadStatus");
      const runBtn = document.getElementById("runOrthofinderBtn");
  
      if (ids.length === 0) {
        status.textContent = "⚠️ No proteomes selected.";
        status.className = "status-message error";
        status.classList.remove("hidden");
        return;
      }
  
      status.textContent = "⏳ Downloading...";
      status.className = "status-message success";
      status.classList.remove("hidden");
  
      fetch("/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ proteome_ids: ids })
      })
      .then(res => res.json())
      .then(data => {
        if (data.vacios && data.vacios.length > 0) {
          status.textContent = `⚠️ Removed empty proteomes (${data.vacios.length}): ${data.vacios.join(", ")}`;
        } else {
          status.textContent = "✅ All proteomes downloaded successfully.";
        }
        runBtn.disabled = false;
      })
      .catch(err => {
        status.textContent = "❌ Error: " + err;
        status.className = "status-message error";
      });
    });
  

    document.getElementById("runOrthofinderBtn").addEventListener("click", function () {
      const logPanel = document.getElementById("logPanel");
      const gif = document.getElementById("loadingGif");
      const postBtns = document.getElementById("postAnalysisButtons");
  
      logPanel.style.display = "block";
      gif.style.display = "block";
      logPanel.textContent = "🟡 Starting OrthoFinder...\n";
  
      const eventSource = new EventSource("/stream_orthofinder");
  
      eventSource.onmessage = function (event) {
        if (event.data === "DONE") {
          logPanel.textContent += "\n✅ Analysis complete!";
          gif.style.display = "none";
          postBtns.style.display = "block";
          eventSource.close();
        } else {
          logPanel.textContent += event.data + "\n";
          logPanel.scrollTop = logPanel.scrollHeight;
        }
      };
  
      eventSource.onerror = function () {
        logPanel.textContent += "\n❌ Error receiving data.";
        gif.style.display = "none";
        eventSource.close();
      };
    });
  
    function runGeneOntologyPreselected() {
      fetch('/cargar_carpeta?filename=Orthogroups.zip&modo=preselected')
        .then(response => {
          if (!response.ok) {
            alert('Error preparing data for GO analysis.');
            return;
          }
          window.location.href = '/resultado_goa';
        })
        .catch(error => {
          alert('Unexpected error:' + error.message);
        });
    }
    window.runGeneOntologyPreselected = runGeneOntologyPreselected;
  </script>

</body>
</html>
