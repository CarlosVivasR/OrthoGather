name: 🐛 Bug report
description: Something in OrthoGather isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve OrthoGather! Please fill in what you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: I selected 5 species, clicked Run OrthoFinder, and…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (WSL)
        - Linux
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How did you install it?
      placeholder: One-click installer / conda environment.yml / other
  - type: textarea
    id: logs
    attributes:
      label: Error message or terminal output
      description: Paste any red error text or the message OrthoGather showed.
      render: shell
