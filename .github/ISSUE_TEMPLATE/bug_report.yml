name: Bug report
description: Something in OrthoGather isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a problem. Please fill in what you can; the version and any ERR_ code help most.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: I selected 5 species, clicked Run OrthoFinder, and…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows (WSL)
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OrthoGather version
      description: Shown in the sidebar of the application and in any exported provenance file.
      placeholder: "2.1.0"
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: How did you install it?
      placeholder: macOS installer / Windows installer / Conda (environment.yml) / other
  - type: input
    id: error-code
    attributes:
      label: Error code
      description: If OrthoGather showed a code starting with ERR_, paste it here.
      placeholder: ERR_...
  - type: textarea
    id: logs
    attributes:
      label: Error message or terminal output
      description: Paste the message OrthoGather showed and any error text from the terminal or the OrthoGather window. On Windows, the installer log is in %LOCALAPPDATA%\OrthoGather\install-log.txt.
      render: shell
