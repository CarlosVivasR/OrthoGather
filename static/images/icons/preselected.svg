<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 80" role="img" aria-label="Preselected dataset of 47 species">
  <!-- Phylogenetic tree (ladderized: 2 clades of 3 leaves, all right-angle branches) -->
  <g stroke="#0369a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 8 40 H 16
             M 16 22 V 58
             M 16 22 H 26
             M 16 58 H 26
             M 26 22 V 10 H 40
             M 26 22 H 40
             M 26 22 V 34 H 40
             M 26 58 V 46 H 40
             M 26 58 H 40
             M 26 58 V 70 H 40"/>
  </g>

  <!-- Leaf species nodes -->
  <g fill="#0369a1">
    <circle cx="42" cy="10" r="3.5"/>
    <circle cx="42" cy="22" r="3.5"/>
    <circle cx="42" cy="34" r="3.5"/>
    <circle cx="42" cy="46" r="3.5"/>
    <circle cx="42" cy="58" r="3.5"/>
    <circle cx="42" cy="70" r="3.5"/>
  </g>

  <!-- Species row bars -->
  <g fill="#0369a1" opacity="0.5">
    <rect x="52" y="14" width="34" height="4" rx="2"/>
    <rect x="52" y="22" width="28" height="4" rx="2"/>
    <rect x="52" y="34" width="38" height="4" rx="2"/>
    <rect x="52" y="42" width="24" height="4" rx="2"/>
    <rect x="52" y="54" width="32" height="4" rx="2"/>
    <rect x="52" y="62" width="20" height="4" rx="2"/>
  </g>

  <!-- 47 species badge — dark blue (not green) for colour-blind safety + WCAG contrast -->
  <circle cx="94" cy="14" r="13" fill="#1e40af"/>
  <text x="94" y="18.5" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif"
        font-size="11" font-weight="800" fill="#ffffff">47</text>
</svg>
