<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 130">
  <!-- ─── Step 1: Species ─── -->
  <g transform="translate(15, 30)">
    <rect x="0" y="0" width="90" height="70" rx="10" fill="#ffffff" stroke="#1e40af" stroke-width="2.2"/>
    <!-- Species network -->
    <g stroke="#1e40af" stroke-width="1.5" stroke-linecap="round" opacity="0.65" fill="none">
      <line x1="20" y1="20" x2="42" y2="15"/>
      <line x1="42" y1="15" x2="62" y2="22"/>
      <line x1="42" y1="15" x2="30" y2="35"/>
      <line x1="62" y1="22" x2="55" y2="38"/>
    </g>
    <g fill="#1e40af">
      <circle cx="20" cy="20" r="4"/>
      <circle cx="42" cy="15" r="4"/>
      <circle cx="62" cy="22" r="4"/>
      <circle cx="30" cy="35" r="4"/>
      <circle cx="55" cy="38" r="4"/>
    </g>
    <text x="45" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="10" font-weight="700" fill="#1e40af">Species</text>
    <!-- Step number badge -->
    <circle cx="-2" cy="-2" r="11" fill="#1e40af"/>
    <text x="-2" y="2" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="11" font-weight="800" fill="#ffffff">1</text>
  </g>

  <!-- Arrow 1 → 2 -->
  <path d="M110 65 L122 65" stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>

  <!-- ─── Step 2: OrthoFinder ─── -->
  <g transform="translate(127, 30)">
    <rect x="0" y="0" width="100" height="70" rx="10" fill="#003366"/>
    <!-- Terminal-like lines -->
    <g stroke-width="1.5" stroke-linecap="round" fill="none">
      <line x1="12" y1="16" x2="14" y2="16" stroke="#10b981"/>
      <line x1="18" y1="16" x2="45" y2="16" stroke="#7dd3fc"/>
      <line x1="12" y1="24" x2="55" y2="24" stroke="#7dd3fc" opacity="0.6"/>
      <line x1="12" y1="32" x2="65" y2="32" stroke="#0ea5e9"/>
      <line x1="12" y1="40" x2="50" y2="40" stroke="#7dd3fc" opacity="0.6"/>
    </g>
    <text x="50" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="10" font-weight="700" fill="#ffffff">OrthoFinder</text>
    <!-- Step number badge -->
    <circle cx="-2" cy="-2" r="11" fill="#0c9488"/>
    <text x="-2" y="2" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="11" font-weight="800" fill="#ffffff">2</text>
  </g>

  <!-- Arrow 2 → 3 -->
  <path d="M232 65 L244 65" stroke="#94a3b8" stroke-width="2.2" fill="none" marker-end="url(#arr)"/>

  <!-- ─── Step 3: Orthogroups (mini UpSet bars) ─── -->
  <g transform="translate(249, 30)">
    <rect x="0" y="0" width="100" height="70" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2.2"/>
    <!-- Mini UpSet plot bars -->
    <g fill="#003366">
      <rect x="14" y="18" width="7" height="24" rx="1.5"/>
      <rect x="25" y="25" width="7" height="17" rx="1.5" opacity="0.8"/>
      <rect x="36" y="30" width="7" height="12" rx="1.5" opacity="0.6"/>
      <rect x="47" y="34" width="7" height="8" rx="1.5" opacity="0.45"/>
      <rect x="58" y="37" width="7" height="5" rx="1.5" opacity="0.35"/>
    </g>
    <text x="50" y="58" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="10" font-weight="700" fill="#b45309">Orthogroups</text>
    <!-- Step number badge -->
    <circle cx="-2" cy="-2" r="11" fill="#b45309"/>
    <text x="-2" y="2" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="11" font-weight="800" fill="#ffffff">3</text>
  </g>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
