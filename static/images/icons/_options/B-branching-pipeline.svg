<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 170">
  <!-- ─── Step 1: Species ─── -->
  <g transform="translate(10, 55)">
    <rect x="0" y="0" width="78" height="60" rx="9" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
    <g fill="#1e40af">
      <circle cx="14" cy="14" r="3"/>
      <circle cx="28" cy="20" r="3"/>
      <circle cx="46" cy="14" r="3"/>
      <circle cx="60" cy="20" r="3"/>
      <circle cx="22" cy="30" r="3"/>
      <circle cx="40" cy="32" r="3"/>
      <circle cx="56" cy="32" r="3"/>
    </g>
    <text x="39" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#1e40af">Species</text>
  </g>

  <path d="M93 85 L113 85" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" fill="none"/>

  <!-- ─── Step 2: OrthoFinder ─── -->
  <g transform="translate(118, 55)">
    <rect x="0" y="0" width="100" height="60" rx="9" fill="#003366"/>
    <line x1="12" y1="18" x2="48" y2="18" stroke="#7dd3fc" stroke-width="1.5"/>
    <line x1="12" y1="26" x2="60" y2="26" stroke="#0ea5e9" stroke-width="1.5"/>
    <line x1="12" y1="34" x2="50" y2="34" stroke="#7dd3fc" stroke-width="1.5" opacity="0.6"/>
    <text x="50" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#ffffff">OrthoFinder</text>
  </g>

  <path d="M223 85 L243 85" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)" fill="none"/>

  <!-- ─── Step 3: Orthogroups ─── -->
  <g transform="translate(248, 55)">
    <rect x="0" y="0" width="80" height="60" rx="9" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect x="12" y="14" width="56" height="4" rx="1.5" fill="#003366"/>
    <rect x="12" y="22" width="44" height="4" rx="1.5" fill="#1e40af" opacity="0.7"/>
    <rect x="12" y="30" width="50" height="4" rx="1.5" fill="#475569" opacity="0.5"/>
    <text x="40" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="700" fill="#475569">Orthogroups</text>
  </g>

  <!-- Branching curves -->
  <path d="M333 85 Q360 70 380 50 Q390 42 400 38" stroke="#003366" stroke-width="2" fill="none" marker-end="url(#arrt)"/>
  <path d="M333 85 Q360 100 380 120 Q390 128 400 132" stroke="#0c9488" stroke-width="2" fill="none" marker-end="url(#arrg)"/>

  <!-- Output 1: Protein -->
  <g transform="translate(403, 18)">
    <rect x="0" y="0" width="55" height="42" rx="7" fill="#e6ecf2" stroke="#003366" stroke-width="1.6"/>
    <!-- mini upset -->
    <g fill="#003366">
      <rect x="6"  y="8"  width="4" height="13" rx="0.8"/>
      <rect x="12" y="11" width="4" height="10" rx="0.8" opacity="0.78"/>
      <rect x="18" y="14" width="4" height="7" rx="0.8" opacity="0.58"/>
      <rect x="24" y="16" width="4" height="5" rx="0.8" opacity="0.4"/>
    </g>
    <text x="27" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#003366">Protein</text>
  </g>

  <!-- Output 2: GO -->
  <g transform="translate(403, 112)">
    <rect x="0" y="0" width="55" height="42" rx="7" fill="#ccfbf1" stroke="#0c9488" stroke-width="1.6"/>
    <!-- mini GO tree -->
    <g stroke="#115e59" stroke-width="1" fill="none">
      <line x1="27" y1="9" x2="14" y2="18"/>
      <line x1="27" y1="9" x2="27" y2="18"/>
      <line x1="27" y1="9" x2="40" y2="18"/>
    </g>
    <g fill="#115e59">
      <circle cx="27" cy="9" r="2.4"/>
      <circle cx="14" cy="18" r="1.8" opacity="0.85"/>
      <circle cx="27" cy="18" r="1.8" opacity="0.85"/>
      <circle cx="40" cy="18" r="1.8" opacity="0.85"/>
    </g>
    <text x="27" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#0c9488">GO terms</text>
  </g>

  <defs>
    <marker id="arr"  markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/></marker>
    <marker id="arrt" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#003366"/></marker>
    <marker id="arrg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0c9488"/></marker>
  </defs>
</svg>
