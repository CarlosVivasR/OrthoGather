name: orthogather
channels:
  - conda-forge
  - bioconda
  - defaults
# Versions are pinned to the ones the test suite and the worked example were verified with,
# so that a new installation gives the same results. Checked to install on osx-arm64, osx-64 and
# linux-64 (also used by Windows through WSL).
dependencies:
  - python=3.11.15
  - flask=3.1.3
  - flask-session=0.8.0
  - werkzeug=3.1.8
  - pandas=3.0.3
  - numpy=2.4.6
  - scipy=1.17.1
  # Installed by GOATOOLS; 0.15 removed the multipletests import that GOATOOLS 1.6.4 uses, which
  # made every GO enrichment fail in a fresh installation.
  - statsmodels=0.14.6
  - goatools=1.6.4
  - requests=2.34.2
  - openpyxl=3.1.5
  - orthofinder=2.5.5
